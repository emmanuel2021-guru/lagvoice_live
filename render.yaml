services:
  - type: web
    name: lagvoice-web
    env: node
    buildCommand: npm install && npm run build && cd backend && npm install && npx prisma generate
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: lagvoice-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true

  - type: psql
    name: lagvoice-db
    databaseName: lagvoice
    user: lagvoice_user
    plan: free
