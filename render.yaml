services:
  - type: web
    name: lagvoice-web
    env: node
    plan: free
    buildCommand: npm install && npm run build && cd backend && npm install && npx prisma generate
    startCommand: npm start
    preDeployCommand: cd backend && npx prisma db push --accept-data-loss && npm run seed
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: lagvoice-db-v2
          property: connectionString
      - key: JWT_SECRET
        generateValue: true

databases:
  - name: lagvoice-db-v2
    databaseName: lagvoice_db_v2
    user: lagvoice_db_v2_user
    plan: free
